<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recettes Fit & Gourmet</title>
    <style>
        :root {
            --bg-color: #2b1e1a;
            --card-bg: #33231e;
            --banner-bg: #422d27;
            --accent-color: #d97736;
            --text-light: #f5ebe6;
            --text-muted: #d1b8ad;
            --badge-bg: #f7f0e6;
            --badge-text: #2b1e1a;
            --amazon-gold: #ff9900;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-light);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        .container { max-width: 850px; margin: 0 auto; }

        header {
            background: linear-gradient(135deg, #1f1411 0%, #3a2822 100%);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #4a342c;
            margin-bottom: 25px;
        }

        header h1 { margin: 0 0 10px 0; color: #f7d6c8; }

        .legend {
            background-color: #231815;
            padding: 8px 15px;
            border-radius: 6px;
            font-size: 0.85em;
            display: inline-block;
            margin-top: 10px;
            color: #e2c0b2;
        }

        .interactive-panel {
            background-color: #382721;
            border: 1px solid #543b32;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 25px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) { .interactive-panel { grid-template-columns: 1fr; } }

        .panel-group label {
            display: block;
            font-weight: bold;
            color: #e8cca4;
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .panel-group input, .panel-group select {
            width: 100%;
            padding: 8px 12px;
            background-color: #231815;
            border: 1px solid #63473c;
            color: var(--text-light);
            border-radius: 6px;
            box-sizing: border-box;
        }

        .recipe-card {
            background-color: var(--card-bg);
            border: 1px solid #4a342c;
            border-radius: 12px;
            margin-bottom: 25px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .recipe-header {
            background-color: var(--banner-bg);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #543b32;
        }

        .recipe-header h2 { margin: 0; font-size: 1.3em; color: #f7d6c8; }
        .recipe-meta { text-align: right; font-size: 0.85em; color: var(--text-muted); }
        .stars { color: #f39c12; }
        .recipe-body { padding: 20px; }

        .macros-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            background-color: #231815;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
        }

        .macro-val { display: block; font-weight: bold; color: #f7d6c8; }
        .macro-label { font-size: 0.75em; color: var(--text-muted); }

        .section-title {
            font-size: 0.95em;
            color: #e8cca4;
            text-transform: uppercase;
            border-left: 3px solid var(--accent-color);
            padding-left: 8px;
            margin: 15px 0 10px 0;
        }

        .ingredients-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; }

        .ingredient-badge {
            background-color: var(--badge-bg);
            color: var(--badge-text);
            font-weight: 600;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
        }

        .ingredient-badge .qty { color: #b84a00; font-weight: bold; }

        .custom-tag {
            background-color: #e8cca4 !important;
            border: 1px dashed #b84a00;
        }

        .timer-container {
            background-color: #231815;
            border: 1px dashed var(--accent-color);
            padding: 10px 15px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 15px;
        }

        .timer-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .timer-btn:hover { background-color: #be6123; }

        .amazon-box {
            background-color: #281c18;
            padding: 12px 20px;
            border-top: 1px solid #4a342c;
            font-size: 0.85em;
        }

        .amazon-box strong { color: var(--amazon-gold); display: block; margin-bottom: 5px; }
        .amazon-link { color: #f7d6c8; margin-right: 15px; text-decoration: underline; }
        .amazon-link:hover { color: var(--amazon-gold); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>RECETTES FIT & GOURMET</h1>
        <p>Alimentation protéinée & Outils interactifs</p>
        <div class="legend">
            <strong>Légende :</strong> ★☆☆☆☆ = Très facile &nbsp;|&nbsp; ★★★☆☆ = Technique moyenne &nbsp;|&nbsp; ★★★★★ = Élaboré
        </div>
    </header>

    <div class="interactive-panel">
        <div class="panel-group">
            <label for="portionSelect">👤 Nombre de personnes :</label>
            <select id="portionSelect" onchange="updatePortions()">
                <option value="1">1 Personne (Par défaut)</option>
                <option value="2">2 Personnes (x2)</option>
                <option value="4">4 Personnes (x4)</option>
            </select>
        </div>
        <div class="panel-group">
            <label for="customIngredient">➕ Ingrédient sur mesure :</label>
            <input type="text" id="customIngredient" placeholder="Ex: 10g Graines de courge..." onkeypress="addCustomIngredient(event)">
        </div>
    </div>

    <!-- Zone d'affichage dynamique des recettes -->
    <div id="recipesContainer"></div>
</div>

<script>
    let recipesData = [];

    // Chargement du fichier JSON
    fetch('recettes.json')
        .then(response => response.json())
        .then(data => {
            recipesData = data;
            renderRecipes(recipesData);
        })
        .catch(error => console.error("Erreur de chargement des recettes :", error));

    function renderRecipes(recipes) {
        const container = document.getElementById('recipesContainer');
        container.innerHTML = '';

        recipes.forEach(r => {
            let ingredientsHTML = r.ingredients.map(ing => {
                if(ing.texteFixe) {
                    return `<span class="ingredient-badge">${ing.texteFixe}</span>`;
                }
                return `<span class="ingredient-badge"><span class="qty" data-base="${ing.base}">${ing.base}</span>${ing.unite} ${ing.nom}</span>`;
            }).join('');

            let instructionsHTML = r.instructions.map(inst => `<li>${inst}</li>`).join('');

            let amazonHTML = r.amazon ? r.amazon.map(a => `<a class="amazon-link" target="_blank" href="${a.url}">${a.texte}</a>`).join('') : '';

            const card = document.createElement('div');
            card.className = 'recipe-card';
            card.innerHTML = `
                <div class="recipe-header">
                    <h2>${r.id}. ${r.titre}</h2>
                    <div class="recipe-meta">
                        <span class="stars">${r.difficulte}</span><br>
                        <span>${r.temps}</span>
                    </div>
                </div>
                <div class="recipe-body">
                    <div class="macros-grid">
                        <div><span class="macro-val">${r.kcal}</span><span class="macro-label">kcal</span></div>
                        <div><span class="macro-val">${r.proteines}</span><span class="macro-label">Protéines</span></div>
                        <div><span class="macro-val">${r.glucides}</span><span class="macro-label">Glucides</span></div>
                        <div><span class="macro-val">${r.lipides}</span><span class="macro-label">Lipides</span></div>
                    </div>
                    <div class="section-title">Ingrédients</div>
                    <div class="ingredients-list">${ingredientsHTML}</div>
                    <div class="section-title">Instructions</div>
                    <ol>${instructionsHTML}</ol>
                    ${r.timerSec ? `
                    <div class="timer-container">
                        <span>⏱️ Minuteur : <strong>--:--</strong></span>
                        <button class="timer-btn" onclick="startTimer(this, ${r.timerSec})">${r.timerLabel}</button>
                    </div>` : ''}
                </div>
                ${amazonHTML ? `
                <div class="amazon-box">
                    <strong>🛒 Matériel & Produits Recommandés :</strong>
                    ${amazonHTML}
                </div>` : ''}
            `;
            container.appendChild(card);
        });
    }

    function updatePortions() {
        const factor = parseFloat(document.getElementById('portionSelect').value);
        const qtyElements = document.querySelectorAll('.qty');

        qtyElements.forEach(el => {
            const baseValue = parseFloat(el.getAttribute('data-base'));
            if (!isNaN(baseValue)) {
                let newValue = baseValue * factor;
                el.innerText = Number.isInteger(newValue) ? newValue : newValue.toFixed(1);
            }
        });
    }

    function addCustomIngredient(event) {
        if (event.key === 'Enter') {
            const input = document.getElementById('customIngredient');
            const value = input.value.trim();

            if (value !== "") {
                const lists = document.querySelectorAll('.ingredients-list');
                lists.forEach(list => {
                    const badge = document.createElement('span');
                    badge.className = 'ingredient-badge custom-tag';
                    badge.innerText = "➕ " + value;
                    list.appendChild(badge);
                });
                input.value = "";
            }
        }
    }

    function startTimer(btn, seconds) {
        btn.disabled = true;
        let remaining = seconds;
        const container = btn.parentElement.querySelector('strong');

        const interval = setInterval(() => {
            let m = Math.floor(remaining / 60);
            let s = remaining % 60;
            container.innerText = `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;

            if (remaining <= 0) {
                clearInterval(interval);
                container.innerText = "Terminé ! 🔔";
                btn.disabled = false;
            }
            remaining--;
        }, 1000);
    }
</script>

</body>
</html>
