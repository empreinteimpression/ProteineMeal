<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Recherche de Recettes</title>
  <style>
    body {
      background-color: #2b1810; /* Marron plus foncé */
      color: #f5f5f5;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .form-container {
      background-color: #3d2318;
      padding: 20px;
      border-radius: 8px;
      max-width: 500px;
      margin: 0 auto 30px auto;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #663b2a;
      background-color: #1f110b;
      color: #fff;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 10px;
      background-color: #8b4513;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #a0522d;
    }

    /* Masqué par défaut jusqu'à validation */
    #resultats {
      display: none;
      max-width: 800px;
      margin: 0 auto;
    }

    .recette-card {
      background-color: #3d2318;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <div class="form-container">
    <h2>Trouver une recette</h2>
    <form id="recipeForm">
      
      <!-- Nombre de personnes libre -->
      <div class="form-group">
        <label for="personnes">Nombre de personnes :</label>
        <input type="number" id="personnes" name="personnes" min="1" value="2" required>
      </div>

      <!-- Ingrédient 1 avec la liste -->
      <div class="form-group">
        <label for="ingredient1">Ingrédient 1 :</label>
        <select id="ingredient1" name="ingredient1">
          <option value="">-- Choisir un ingrédient --</option>
          <option value="poulet">Poulet</option>
          <option value="boeuf">Bœuf</option>
          <option value="saumon">Saumon</option>
          <option value="thon">Thon</option>
          <option value="crevettes">Crevettes</option>
          <option value="oeufs">Œufs</option>
          <option value="tofu">Tofu</option>
          <option value="riz">Riz</option>
          <option value="pates">Pâtes</option>
          <option value="lentilles">Lentilles</option>
          <option value="avocat">Avocat</option>
          <option value="patate_douce">Patate douce</option>
        </select>
      </div>

      <!-- Ingrédient 2 optionnel -->
      <div class="form-group">
        <label for="ingredient2">Ingrédient 2 (optionnel) :</label>
        <input type="text" id="ingredient2" name="ingredient2" placeholder="Ex: Brocoli, Miel, Citron...">
      </div>

      <!-- Type de plat -->
      <div class="form-group">
        <label for="typePlat">Type de plat :</label>
        <select id="typePlat" name="typePlat">
          <option value="tous">Tous les types</option>
          <option value="petit_dejeuner">Petit-déjeuner / Snack</option>
          <option value="entree_salade">Bowls & Salades</option>
          <option value="plat_chaud">Plat chaud du quotidien</option>
          <option value="poisson_viande">Poissons & Viandes</option>
          <option value="mijote">Mijoté / Élaboré</option>
        </select>
      </div>

      <button type="submit">Valider</button>
    </form>
  </div>

  <!-- Section résultats masquée par défaut -->
  <div id="resultats">
    <h2>Recettes correspondantes</h2>
    <div id="listeRecettes"></div>
  </div>

  <script>
    document.getElementById('recipeForm').addEventListener('submit', function(e) {
      e.preventDefault();

      // Récupération des valeurs du formulaire
      const nbPersonnes = document.getElementById('personnes').value;
      const ing1 = document.getElementById('ingredient1').value;
      const ing2 = document.getElementById('ingredient2').value;
      const type = document.getElementById('typePlat').value;

      // Affichage de la zone de résultats après validation
      const resultatsDiv = document.getElementById('resultats');
      const listeDiv = document.getElementById('listeRecettes');
      
      resultatsDiv.style.display = 'block';

      // Exemple d'affichage dynamique des critères sélectionnés
      listeDiv.innerHTML = `
        <div class="recette-card">
          <h3>Recherche validée !</h3>
          <p><strong>Personnes :</strong> ${nbPersonnes}</p>
          <p><strong>Ingrédient principal :</strong> ${ing1 || 'Non spécifié'}</p>
          <p><strong>Ingrédient secondaire :</strong> ${ing2 || 'Aucun'}</p>
          <p><strong>Type de plat :</strong> ${type}</p>
        </div>
      `;
    });
  </script>

</body>
</html>
